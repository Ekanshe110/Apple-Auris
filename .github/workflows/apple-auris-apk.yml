name: Apple Auris APK

# Built once per accepted batch, on purpose: a signed APK per micro-commit
# burns a full Android build without producing a new version. Unit tests and
# the release compile still run on every push; the signed artifact is produced
# here only when it is actually going to be installed.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apple-auris-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build signed Apple Auris APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        run: |
          {
            echo "sdk.dir=${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
            echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}"
            echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}"
          } > local.properties

      - name: Decode signing key
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_B64"
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > bitchord-apple.jks
          {
            echo "storeFile=bitchord-apple.jks"
            echo "storePassword=android"
            echo "keyAlias=forkdebug"
            echo "keyPassword=android"
          } > keystore.properties
          chmod 600 bitchord-apple.jks keystore.properties

      - run: chmod +x gradlew

      - name: Build
        run: ./gradlew :app:assembleDevRelease --stacktrace --console=plain

      - name: Verify package, label, version and signature
        env:
          EXPECTED_PACKAGE: com.dev.bitchord
          EXPECTED_LABEL: Apple Auris
          EXPECTED_VERSION_CODE: "149"
          EXPECTED_VERSION_NAME: "3.0.41-apple.1"
          EXPECTED_SIGNER_SHA256: "fe7d54041b91fc9383ac0945d1a2dbffac608e38498a2aa7d7c7ffc4e037cd29"
        run: |
          set -euo pipefail
          bt="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          apks=(app/build/outputs/apk/dev/release/*.apk)
          test "${#apks[@]}" -gt 0
          for apk in "${apks[@]}"; do
            echo "== $apk"
            badging="$("$bt/aapt2" dump badging "$apk")"
            package_line="$(printf '%s\n' "$badging" | grep -E '^package:' | head -1)"
            label_line="$(printf '%s\n' "$badging" | grep -E "^application-label:" | head -1)"
            echo "$package_line"
            echo "$label_line"
            printf '%s\n' "$package_line" | grep -q "package: name='$EXPECTED_PACKAGE'"
            printf '%s\n' "$package_line" | grep -q "versionCode='$EXPECTED_VERSION_CODE'"
            printf '%s\n' "$package_line" | grep -q "versionName='$EXPECTED_VERSION_NAME'"
            printf '%s\n' "$label_line" | grep -q "application-label:'$EXPECTED_LABEL'"
            certs="$("$bt/apksigner" verify --print-certs "$apk")"
            printf '%s\n' "$certs" | grep -i "sha-256" | head -1
            cert="$(printf '%s\n' "$certs" | grep -i "sha-256" | head -1 | tr -d ':' | grep -oiE '[0-9a-f]{64}' | head -1)"
            test "$cert" = "$EXPECTED_SIGNER_SHA256"
          done

      - name: Check APK size against the accepted baseline
        run: |
          set -euo pipefail
          # Accepted sizes from 4a8241ac (artifact 14144304573). A micro-commit
          # carries no new dependency, asset or native library, so any growth is
          # either real code or a mistake. Gate: +1% or +500 KB, whichever is
          # smaller.
          declare -A baseline=(
            [arm64-v8a]=46086632
            [armeabi-v7a]=44965020
            [x86_64]=48032990
            [universal]=85696479
          )
          failed=0
          for apk in app/build/outputs/apk/dev/release/*.apk; do
            name="$(basename "$apk")"
            abi="universal"
            case "$name" in
              *arm64-v8a*) abi="arm64-v8a" ;;
              *armeabi-v7a*) abi="armeabi-v7a" ;;
              *x86_64*) abi="x86_64" ;;
            esac
            base="${baseline[$abi]}"
            limit=$(( base / 100 ))
            if [ "$limit" -gt 512000 ]; then limit=512000; fi
            size="$(stat -c%s "$apk")"
            delta=$(( size - base ))
            printf '%-48s %10d bytes  delta %+d  allowed +%d  (%s)\n' \
              "$name" "$size" "$delta" "$limit" "$abi"
            if [ "$delta" -gt "$limit" ]; then
              echo "::error::$name grew ${delta} bytes, over the ${limit}-byte budget"
              failed=1
            fi
          done
          exit "$failed"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apple-auris-apk
          path: app/build/outputs/apk/dev/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Draft a GitHub release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_VERSION_NAME: "3.0.41-apple.1"
        run: |
          set -euo pipefail
          tag="apple-auris-${{ github.run_number }}"
          gh release create "$tag" app/build/outputs/apk/dev/release/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --prerelease \
            --title "Apple Auris ${{ github.run_number }}" \
            --notes "Apple Auris $EXPECTED_VERSION_NAME built from $GITHUB_SHA."
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,assets
